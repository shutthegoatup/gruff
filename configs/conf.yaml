#
# Example config.
#
# The portal does not authenticate anyone. It trusts the identity headers below,
# so it must only ever be reachable through the SSO proxy that sets them. The
# default listen address is loopback for exactly this reason.
#
listen: 127.0.0.1:9000
banner: Gruff

#
# How Gruff establishes who you are.
#
#   proxy  (default)  Trust X-Auth-* headers from an SSO proxy in front. Gruff
#                     authenticates nobody, so it must never be directly
#                     reachable - hence the loopback listen address above.
#
#   oidc              Gruff runs the OpenID Connect code flow itself and holds
#                     the session. It is meant to be exposed; listen on :9000.
#                     Logout works in this mode because Gruff owns the session.
#
auth:
  mode: proxy

  # mode: oidc
  # issuer: https://auth.example.com/realms/main
  # client-id: gruff
  # client-secret-env: GRUFF_CLIENT_SECRET
  # redirect-url: https://gruff.example.com/auth/callback
  # roles-claim: groups
  # username-claim: preferred_username
  # session-lifetime: 8h
  #
  # 32 random bytes; rotating this signs everyone out at once.
  #   head -c 32 /dev/urandom | base64 > /etc/gruff/session.key
  # session-key-file: /etc/gruff/session.key

# Gruff holds no session in trusted-header mode, so it cannot log anyone out.
# Set this only to a URL that actually ends the session - your proxy's sign-out
# endpoint, not the IdP's - otherwise leave it unset and no button is shown.
# logout-url: https://gruff.example.com/oauth2/sign_out

help-url: https://github.com/shutthegoatup/gruff/issues

fullname-header: X-Auth-Fullname
username-header: X-Auth-Username
roles-header: X-Auth-Roles

# Required when ssh-profiles are configured. An OpenSSH private key; hosts
# trust the matching public key via TrustedUserCAKeys. See /setup for the
# exact sshd_config to deploy.
# ssh-ca-private-file: tmp/tls/ssh/ca

# Required. The portal will not start without a CA.
# For local development use -dev-generate-ca -dev-ca-dir tmp/tls instead.
# ca-certificate-file: tmp/tls/ca/cert.pem
# ca-private-file: tmp/tls/ca/key.pem

# Cap on credentials issued per user per hour, across both VPN and SSH. It
# bounds a client stuck in a loop or a compromised session; 0 disables it.
# Denied requests do not count against it.
# issues-per-hour: 20

# Drops OpenVPN client-config-dir and firewall files at startup.
# configdir-enabled: true
# configdir-path: /tmp/profiles

# Every profile must grant at least one role: access is denied by default, so a
# profile with no roles would be unreachable and is rejected at startup.
profiles:
  - name: livedata
    description: Live Data
    max-session: 2h
    roles:
      - vpn-livedata
    routes:
      - 192.168.1.0/24
    rules:
      - dest: 192.168.1.0/24
        port: 53
        protocol: tcp
        action: ACCEPT
  - name: notlivedata
    description: Not Live Data
    max-session: 8h
    roles:
      - vpn-notlivedata
    routes:
      - 172.16.0.0/16
    rules:
      - dest: 172.16.0.0/16
        port: 53
        protocol: udp
        action: ACCEPT

# SSH access is granted separately from VPN access: holding a network does not
# imply login on its hosts. Principals are the logins a certificate is valid
# for; extensions default to permit-pty and permit-user-rc, so forwarding is
# opt-in.
ssh-profiles:
  - name: bastion
    description: Bastion Hosts
    max-session: 8h
    roles:
      - ssh-bastion
    principals:
      - deploy
    hosts:
      - bastion.example.com
  - name: dbadmin
    description: Database Admin
    max-session: 1h
    roles:
      - ssh-dbadmin
    principals:
      - postgres
    extensions:
      - permit-pty

template: |
  #
  # Expiration of Certificate: {{ .Session.ExpiresOn }}
  # Session Duration: {{ .Session.Duration }}
  # VPN Profile for: {{ .Session.Profile }}
  # Issued to: {{ .Session.User }}
  #

  client
  dev tun
  proto udp
  remote vpn.example.com 1194
  resolv-retry infinite
  remote-cert-tls server
  nobind
  tls-version-min 1.2
  persist-key
  persist-tun
  ca [inline]
  cert [inline]
  key [inline]
  verb 1
  keepalive 10 900
  inactive 3600
  cipher AES-256-GCM
  tls-cipher TLS-ECDHE-RSA-WITH-AES-128-GCM-SHA256:TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256:TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384

  <ca>
  {{ .Session.IssuingCA }}</ca>

  <cert>
  {{ .Session.Certificate }}</cert>

  <key>
  {{ .Session.PrivateKey }}</key>
