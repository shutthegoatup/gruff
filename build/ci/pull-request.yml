resource_types:
- name: pull-request
  type: registry-image
  source:
    repository: teliaoss/github-pr-resource

resources:
- name: pull-request
  type: pull-request
  check_every: 24h
  webhook_token: foobarbaz
  source:
    repository: shutthegoatup/gruff

anchors:
  go_task: &go_task
    platform: linux
    image_resource:
      type: registry-image
      source: {repository: golang, tag: "1.27"}
    inputs:
    - name: pull-request

jobs:
- name: lint
  public: true
  plan:
  - get: pull-request
    trigger: true
  - task: lint
    config:
      <<: *go_task
      run:
        dir: pull-request
        path: /bin/sh
        args:
        - -ec
        - |
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }

- name: test
  public: true
  plan:
  - get: pull-request
    trigger: true
  - task: test
    config:
      <<: *go_task
      run:
        dir: pull-request
        path: /bin/sh
        args: ["-ec", "go test -race ./..."]

- name: vulncheck
  public: true
  plan:
  - get: pull-request
    trigger: true
  - task: vulncheck
    config:
      <<: *go_task
      run:
        dir: pull-request
        path: /bin/sh
        args: ["-ec", "go run golang.org/x/vuln/cmd/govulncheck@latest ./..."]

- name: build
  public: true
  plan:
  - get: pull-request
    trigger: true
    passed: [lint, test, vulncheck]
  - task: build
    config:
      <<: *go_task
      run:
        dir: pull-request
        path: /bin/sh
        args: ["-ec", "CGO_ENABLED=0 go build -trimpath -o gruff ./cmd/gruff"]
