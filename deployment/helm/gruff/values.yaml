#
# Helm chart example config.
#
# Traffic path: Ingress -> gruff (:9000)
#
# Gruff authenticates users itself via OpenID Connect, so there is no sidecar
# and it is meant to be exposed. If you would rather front it with your own SSO
# proxy, set auth.mode to proxy in the config below AND bind listen back to
# 127.0.0.1, then point the Service at the proxy: in proxy mode Gruff believes
# the X-Auth-* headers of whoever reaches the port.
#
image:
  gruff: quay.io/shutthegoatup/gruff:0.3.0
  # Placeholder: no such image is published anywhere. Supply your own OpenVPN
  # image and pin it. All Gruff needs of it is that it runs openvpn against
  # $OPENVPN_CONFIG as uid 0 with NET_ADMIN, and passes the config through
  # untouched - the client-connect hook in it is how profile routes are chosen.
  openvpn: shutthegoatup/openvpn

service:
  # Port Gruff listens on; this is what the Ingress targets.
  gruff:
    port: 9000
  openvpn:
    internalPort: 1194
    externalPort: 1194

ingress:
  enabled: true
  className: ""
  host: gruff.example.com
  annotations: {}
  tls:
    secretName: gruff-tls

##
# The portal will not start without a CA: it refuses to silently mint a trust
# anchor. Provide a Secret with cert.pem and key.pem.
#
#   kubectl create secret generic gruff-ca \
#     --from-file=cert.pem --from-file=key.pem
##
ca:
  existingSecret: ""

##
# The OpenVPN server's own keypair, signed by the CA above. Secret keys:
# cert.pem and key.pem. Gruff will issue it for you - a client certificate
# cannot stand in, because clients check for the serverAuth usage it must not
# carry:
#
#   gruff sign-server -config gruff.yml -cn vpn.example.com \
#     -hosts vpn.example.com -out ./server
#   kubectl create secret generic gruff-openvpn \
#     --from-file=cert.pem=server/cert.pem --from-file=key.pem=server/key.pem
##
openvpn:
  existingSecret: ""

##
# OIDC client secret and the session key, both from Secrets rather than this
# file. The session key is 32 random bytes; rotating it signs everyone out.
#
#   kubectl create secret generic gruff-auth \
#     --from-literal=client-secret=... \
#     --from-file=session.key=<(head -c 32 /dev/urandom)
##
auth:
  existingSecret: ""
  clientSecretKey: client-secret
  sessionKeyKey: session.key

# Secret volumes are owned by root:fsGroup, and Gruff runs as 65532, so it can
# only read its CA key and session key if it is in that group.
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

resources:
  gruff:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  openvpn:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

##
# Config files, dropped straight into a ConfigMap.
##
config: |
  gruff.yml: |
    # Gruff holds the session itself, so this is reachable from the Ingress and
    # from the kubelet's probes. Only bind loopback if something in this pod is
    # authenticating on its behalf.
    listen: 0.0.0.0:9000
    banner: Gruff
    # Where the provider returns to after signing out. Gruff ends its own
    # session and then hands off to the provider's end-session endpoint.
    logout-url: https://gruff.example.com/
    help-url: https://github.com/shutthegoatup/gruff/issues

    # Without this block Gruff runs in proxy mode, which believes the X-Auth-*
    # headers of anything that can reach the port - and the Ingress above sends
    # it the internet.
    auth:
      mode: oidc
      issuer: https://auth.example.com/realms/main
      client-id: gruff
      client-secret-env: GRUFF_CLIENT_SECRET
      redirect-url: https://gruff.example.com/auth/callback
      # The claim carrying the roles the profiles below are matched against.
      roles-claim: groups
      username-claim: preferred_username
      session-key-file: /etc/gruff/auth/session.key
      session-lifetime: 8h

    ca-certificate-file: /etc/tls/ca/cert.pem
    ca-private-file: /etc/tls/ca/key.pem

    configdir-enabled: true
    configdir-path: /tmp/gruff/profiles

    # Every profile must grant at least one role; access is denied by default.
    profiles:
    - name: livedata
      description: Live Data
      max-session: 2h
      roles:
        - vpn-livedata
      routes:
        - 192.168.1.0/24
      rules:
        - dest: 192.168.1.0/24
          port: 53
          protocol: tcp
          action: ACCEPT
    - name: notlivedata
      description: Not Live Data
      max-session: 8h
      roles:
        - vpn-notlivedata
      routes:
        - 172.16.0.0/16
      rules:
        - dest: 172.16.0.0/16
          port: 53
          protocol: udp
          action: ACCEPT

    template: |
      #
      # Expiration of Certificate: {{ "{{ .Session.ExpiresOn }}" }}
      # Session Duration: {{ "{{ .Session.Duration }}" }}
      # VPN Profile for: {{ "{{ .Session.Profile }}" }}
      # Issued to: {{ "{{ .Session.User }}" }}
      #

      client
      dev tun
      proto udp
      remote vpn.example.com 1194
      resolv-retry infinite
      remote-cert-tls server
      nobind
      tls-version-min 1.2
      persist-key
      persist-tun
      ca [inline]
      cert [inline]
      key [inline]
      verb 1
      keepalive 10 900
      inactive 3600
      cipher AES-256-GCM

      <ca>
      {{ "{{ .Session.IssuingCA }}" }}</ca>

      <cert>
      {{ "{{ .Session.Certificate }}" }}</cert>

      <key>
      {{ "{{ .Session.PrivateKey }}" }}</key>

  openvpn.conf: |
    local 0.0.0.0
    port 1194
    proto udp
    dev tun
    ca /etc/tls/ca/cert.pem
    cert /etc/tls/openvpn/cert.pem
    key /etc/tls/openvpn/key.pem
    # Routes come from the client-connect hook, not client-config-dir: the
    # certificate's common name is the user, so a ccd file cannot select a
    # profile, and ccd-exclusive would refuse every client.
    client-connect /tmp/gruff/profiles/rules/connect.sh
    crl-verify /tmp/gruff/profiles/crl.pem
    server 10.100.10.0 255.255.255.0
    management 127.0.0.1 1234
    duplicate-cn
    tls-version-min 1.2
    cipher AES-256-GCM
    keepalive 10 120
    inactive 3600
    script-security 2
    persist-key
    persist-tun
