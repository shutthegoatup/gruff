<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body class="min-h-screen bg-field font-sans text-ink antialiased">
  <header class="on-black bg-ink text-field">
    <nav class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-5 gap-y-2 px-6 py-3.5">
      <a href="/" class="font-display text-lg uppercase tracking-tight">Gruff<span class="text-amber">.</span></a>

      <div class="ml-auto flex flex-wrap items-center gap-x-4 gap-y-1 text-xs font-semibold uppercase tracking-widest">
        <a href="/" class="px-2 py-1 hover:bg-amber hover:text-ink">Profiles</a>
        <a href="/issued" class="px-2 py-1 hover:bg-amber hover:text-ink">Sessions</a>
        {{ with .HelpURL }}<a href="{{ . }}" class="px-2 py-1 hover:bg-amber hover:text-ink">Help</a>{{ end }}

        {{ with .Username }}
          <span class="ml-1 flex items-center gap-2 border-l-2 border-stone-line pl-4 font-mono text-[11px] font-normal normal-case tracking-normal text-stone">
            <span class="bg-amber px-1.5 py-0.5 font-sans text-[10px] font-bold uppercase tracking-wider text-ink">{{ $.Initials }}</span>
            {{ . }}
          </span>
        {{ end }}
        {{ with .LogoutURL }}<a href="{{ . }}" class="px-2 py-1 hover:bg-amber hover:text-ink">Log out</a>{{ end }}
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-9 pb-20">
    {{ template "body" . }}
  </main>
</body>
</html>
